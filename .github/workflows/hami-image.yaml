name: HAMi Image

# Builds the driver image for Project-HAMi/amd-dra-driver and pushes it to
# ghcr.io/project-hami/amd-dra-driver. The upstream ROCm workflows stay in place
# for clean upstream merges; they only run in ROCm/k8s-gpu-dra-driver.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    if: github.repository == 'Project-HAMi/amd-dra-driver'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: recursive
        persist-credentials: false

    - name: Read build arguments
      id: args
      shell: bash
      run: |
        {
          echo "golang_version=$(awk '/^go /{print $2}' go.mod)"
          echo "version=${GITHUB_REF_NAME}"
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}"
        } >> "${GITHUB_OUTPUT}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ steps.args.outputs.image_name }}
        tags: |
          type=raw,value=main,enable={{is_default_branch}}
          type=ref,event=tag
          type=ref,event=pr
          type=sha,format=short,prefix=sha-
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: deployments/container/Dockerfile
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        provenance: false
        sbom: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          GOLANG_VERSION=${{ steps.args.outputs.golang_version }}
          VERSION=${{ steps.args.outputs.version }}
