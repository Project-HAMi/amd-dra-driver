header:
  schema-version: 2.0.0
  last-updated: '2026-10-17'
  last-reviewed: '2026-10-17'
  url: https://raw.githubusercontent.com/Project-HAMi/amd-dra-driver/main/SECURITY-INSIGHTS.yml
  comment: |
    Security metadata for the HAMi amd-dra-driver repository, following
    the OpenSSF Security Insights specification.

project:
  name: HAMi
  homepage: https://project-hami.io
  documentation:
    code-of-conduct: https://github.com/Project-HAMi/community/blob/main/CODE-OF-CONDUCT.md
  administrators:
    - name: Li Mengxuan
      affiliation: dynamia.ai
      email: archlitchi@gmail.com
      primary: true
    - name: Xiao Zhang
      affiliation: dynamia.ai
      email: xiaozhang0210@hotmail.com
      primary: false
  repositories:
    - name: HAMi
      url: https://github.com/Project-HAMi/HAMi
      comment: |
        Main repository, heterogeneous AI computing virtualization
        middleware for Kubernetes.
    - name: amd-device-plugin
      url: https://github.com/Project-HAMi/amd-device-plugin
      comment: |
        Kubernetes device plugin for AMD GPUs, supporting soft vGPU with HAMi.
    - name: amd-dra-driver
      url: https://github.com/Project-HAMi/amd-dra-driver
      comment: |
        Kubernetes DRA driver for AMD GPUs, supporting soft vGPU with HAMi-DRA.
        Based on ROCm/k8s-gpu-dra-driver.
    - name: amd-hami-core
      url: https://github.com/Project-HAMi/amd-hami-core
      comment: |
        LD_AUDIT library (libamvgpu.so) for AMD GPU memory limiting, built into
        the amd-device-plugin and amd-dra-driver release images.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: HAMi maintainers
      primary: true
    policy: https://github.com/Project-HAMi/amd-dra-driver/blob/main/SECURITY.md
    comment: |
      Report vulnerabilities privately via GitHub Security Advisories:
      https://github.com/Project-HAMi/amd-dra-driver/security/advisories/new
      See SECURITY.md for the full policy, scope, and response process.

repository:
  url: https://github.com/Project-HAMi/amd-dra-driver
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  bug-fixes-only: false
  no-third-party-packages: false
  core-team:
    - name: Li Mengxuan
      affiliation: dynamia.ai
      email: archlitchi@gmail.com
      primary: true
    - name: Xiao Zhang
      affiliation: dynamia.ai
      email: xiaozhang0210@hotmail.com
      primary: false
  documentation:
    contributing-guide: https://github.com/Project-HAMi/amd-dra-driver/blob/main/CONTRIBUTING.md
    governance: https://github.com/Project-HAMi/community/blob/main/community-membership.md
    dependency-management-policy: https://github.com/Project-HAMi/amd-dra-driver/blob/main/SECURITY.md#third-party-dependencies
    security-policy: https://github.com/Project-HAMi/amd-dra-driver/blob/main/SECURITY.md
  license:
    url: https://github.com/Project-HAMi/amd-dra-driver/blob/main/LICENSE
    expression: Apache-2.0
  security:
    assessments:
      self:
        comment: |
          Dependencies are monitored with Dependabot and scanned in CI.
          The Go toolchain and modules are updated promptly when
          vulnerabilities are published.
    tools:
      - name: Dependabot
        type: SCA
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Automated dependency update PRs for Go modules and GitHub Actions.
      - name: CodeQL
        type: SAST
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Static analysis on pull requests via GitHub Actions.
      - name: GitHub secret scanning
        type: secret
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          GitHub native secret scanning with push protection.
