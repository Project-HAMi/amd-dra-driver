name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    if: github.repository == 'Project-HAMi/amd-dra-driver'
    permissions:
      security-events: write # to upload CodeQL results
      packages: read
      actions: read
      contents: read
    # cgo builds against the AMD SMI headers and library vendored in third_party.
    env:
      CGO_ENABLED: "1"
      LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/amd_smi/lib

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: go
          build-mode: manual

      - name: Build
        run: go build ./cmd/... ./pkg/...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:go"
